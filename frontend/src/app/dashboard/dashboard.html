<div class="dashboard-container">
  <h2>Your Exercise History</h2>
  <div *ngIf="sessions.length > 0; else noData">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Exercise</th>
          <th>Reps</th>
          <th>Quality Score</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let session of sessions">
          <td>{{ session.created_at | date:'short' }}</td>
          <td>{{ session.exercise_type }}</td>
          <td>{{ session.reps }}</td>
          <td>{{ session.quality_score | number:'1.1-2' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <ng-template #noData>
    <p>No exercise sessions found.</p>
  </ng-template>
</div>
