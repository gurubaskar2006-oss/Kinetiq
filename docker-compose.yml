version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: kinetiq_user
      POSTGRES_PASSWORD: kinetiq_password
      POSTGRES_DB: kinetiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kinetiq_user:kinetiq_password@db:5432/kinetiq_db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
